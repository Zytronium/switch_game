[package]
name = "switch_net"
version = "0.1.0"
edition = "2021"
description = "Raw non-IP/TCP Ethernet frame transport for the Switch Game"

[lib]
name = "switch_net"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.27", features = ["extension-module"] }
pnet = "0.34"
pnet_datalink = "0.34"

[profile.release]
opt-level = 3
